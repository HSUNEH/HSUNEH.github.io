<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suntae Hwang — FDE · AI Builder</title>
<meta name="description" content="FDE and AI builder in Seoul. KRAFTON, HDC LABS, and audio AI research at Seoul National University.">
<!-- 공유 미리보기: 지정하지 않으면 메신저가 본문의 첫 큰 이미지(사원증 사진)를 가져간다 -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://hsuneh.github.io/">
<meta property="og:title" content="Suntae Hwang">
<meta property="og:description" content="FDE · AI Builder in Seoul. I build AI tools people use.">
<meta property="og:image" content="https://hsuneh.github.io/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ece9e2">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/icon-512.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#ece9e2; --desk:#d9d4c9; --ink:#1c1d21; --mute:#7c776c;
  --signal:#ff5a1f; --signal-glow:rgba(255,90,31,.55);
  --alu-1:#e4e4e0; --alu-2:#c9c9c4;
  /* 한글은 IBM Plex Sans KR로 받는다. 한글 글자가 없으면 내려받지 않는다 */
  --display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif; --sans:"IBM Plex Sans","IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,monospace;
  --ease:cubic-bezier(.2,0,0,1);
  --dk:0;
}
*{box-sizing:border-box;margin:0}
html{background:var(--wall);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
html:lang(ko){word-break:keep-all}
body{overflow-x:hidden}
h1,h2,h3{font-weight:500;text-wrap:balance}
p{text-wrap:pretty}
strong{font-weight:500}
a{color:inherit}
.label{font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase}

/* 크롬 */
.chrome{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;padding:18px clamp(16px,3vw,40px);pointer-events:none;transition:color .4s}
.chrome>*{pointer-events:auto}
.chrome .st{font:800 30px/.8 var(--display);letter-spacing:-.06em;color:#e1dcd1;text-decoration:none;padding:4px 6px 6px 0;
  text-shadow:0 -1px 0 rgba(255,255,255,.9),1px 1px 0 #cdc6b8,2px 2px 0 #c3bcac,3px 3px 0 #b9b1a0,4px 4px 0 #ada492,5px 8px 10px rgba(60,48,30,.25)}
.chrome .st::after{content:"";display:inline-block;width:6px;height:6px;margin-left:3px;border-radius:50%;background:var(--signal);box-shadow:0 0 8px var(--signal-glow)}
html.night .chrome .st{color:#e1dcd1;text-shadow:0 -1px 0 rgba(255,255,255,.5),1px 1px 0 #91897a,2px 2px 0 #7d7668,3px 3px 0 #6a6357,4px 4px 0 #575146,5px 8px 10px rgba(0,0,0,.5)}
.chrome .btn{margin-left:auto}
.btn{display:inline-flex;align-items:center;padding:.75em 1.15em;border-radius:999px;font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;white-space:nowrap;
  background:var(--ink);color:#f3f1ec;border:1px solid var(--ink);transition:background .2s var(--ease),border-color .2s,color .2s}
.btn:hover,.btn:focus-visible{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
html.night .chrome{color:#e9e6df}
html.night .chrome .btn:not(:hover){background:#e9e6df;color:var(--ink);border-color:#e9e6df}
/* 언어 전환: 버튼과 같은 높이의 두 칸 스위치 */
.lang{display:inline-flex;margin-left:10px;border:1px solid currentColor;border-radius:999px;overflow:hidden;font:500 12px/1 var(--mono);letter-spacing:.14em}
.lang a{padding:.75em .85em;text-decoration:none;color:inherit;opacity:.55;transition:background .2s var(--ease),color .2s,opacity .2s}
.lang a:hover,.lang a:focus-visible{opacity:1;color:var(--signal)}
.lang a[aria-current]{opacity:1;background:currentColor}
.lang a[aria-current] span{color:#f3f1ec}
html.night .lang a[aria-current] span{color:var(--ink)}
.stops{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;gap:4px}
.stops button{width:22px;height:22px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0;color:inherit}
.stops button::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.28;transition:opacity .2s,background .2s,transform .2s}
.stops button.on::after{background:var(--signal);opacity:1;transform:scale(1.3)}
html.night .stops{color:#e9e6df}

/* 무대: 네이티브 스크롤 위 sticky. 카메라는 world 하나에만 건다 */
.scroller{position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;perspective:var(--P,1600px)}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.wall,.desk{position:absolute;transform-style:preserve-3d}
.wall{background:
  radial-gradient(120% 80% at 50% 100%,rgba(255,255,255,calc(.55 - var(--dk)*.5)),transparent 60%),
  color-mix(in oklab,var(--wall),#202024 calc(var(--dk)*88%))}
.desk{transform-origin:50% 0;transform:rotateX(90deg);
  background:
   radial-gradient(560px 380px at var(--spot-x,50%) var(--spot-y,30%),rgba(255,150,110,calc(var(--dk)*.20)),transparent 70%),
   linear-gradient(180deg,rgba(0,0,0,.10),transparent 160px),
   color-mix(in oklab,var(--desk),#141416 calc(var(--dk)*90%))}

/* 벽: 입체 이름과 히어로 */
.hero{position:absolute;display:flex;flex-direction:column;align-items:flex-start}
.hero .label{color:var(--mute)}
.hero h1{font:700 clamp(44px,5.2vw,92px)/.98 var(--display);letter-spacing:-.035em;margin:.32em 0 .3em}
.hero p{max-width:27em;font-size:clamp(17px,1.25vw,19px);color:#3a3a3e}
.hero .ctas{display:flex;gap:10px;margin-top:26px}
.mark{position:absolute;white-space:pre;font:800 100px/0.8 var(--display);letter-spacing:-.055em;color:#e1dcd1}
/* 글자마다 --p(0 = 솟음, 1 = 눌림). 눌리면 옆면 깊이만큼 아래오른쪽으로 내려앉고 그림자가 짧아진다 */
.mark span{display:inline-block;--k:calc(1 - var(--p, 0));transform:translate(calc(6px * var(--p, 0)),calc(6px * var(--p, 0)));
  color:color-mix(in oklab,#e1dcd1,#cfc8ba calc(var(--p, 0) * 45%));
  text-shadow:
   0 -1px 0 rgba(255,255,255,calc(.9 * var(--k))),
   calc(1px * var(--k)) calc(1px * var(--k)) 0 #d2ccbf,calc(2px * var(--k)) calc(2px * var(--k)) 0 #cdc6b8,calc(3px * var(--k)) calc(3px * var(--k)) 0 #c8c1b2,
   calc(4px * var(--k)) calc(4px * var(--k)) 0 #c3bcac,calc(5px * var(--k)) calc(5px * var(--k)) 0 #beb6a6,calc(6px * var(--k)) calc(6px * var(--k)) 0 #b9b1a0,calc(7px * var(--k)) calc(7px * var(--k)) 0 #b4ab9a,
   calc(10px * var(--k)) calc(14px * var(--k)) calc(4px + 14px * var(--k)) rgba(60,48,30,calc(.08 + .14 * var(--k))),calc(18px * var(--k)) calc(28px * var(--k)) 50px rgba(60,48,30,calc(.18 * var(--k)))}
svg.rope{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.cable{fill:none;stroke:#2a2b30;stroke-width:9;stroke-linecap:round}
.cable-hi{fill:none;stroke:rgba(255,255,255,.22);stroke-width:2.5;stroke-linecap:round}
.cable-sh{fill:none;stroke:rgba(40,30,20,.22);stroke-width:12;stroke-linecap:round;filter:blur(6px)}
.cable-sig{fill:none;stroke:var(--signal);stroke-width:3.5;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--signal-glow))}
.plug{position:absolute;left:0;top:0;width:30px;height:64px;margin:-4px 0 0 -15px;cursor:grab;touch-action:none;transform-origin:50% 4px;border-radius:7px 7px 12px 12px;
  background:linear-gradient(90deg,#16171a,#3a3c43 45%,#1d1e22);box-shadow:0 12px 22px rgba(30,20,10,.28),inset 0 1px 0 rgba(255,255,255,.15)}
.plug::before{content:"";position:absolute;left:10px;bottom:-18px;width:10px;height:20px;border-radius:0 0 2px 2px;background:linear-gradient(90deg,#9b9a96,#f1f0ec 50%,#a7a6a1)}
.plug::after{content:"";position:absolute;left:7px;right:7px;top:40px;height:2px;background:var(--signal);opacity:.85}
.plug:active{cursor:grabbing}
.badge{position:absolute;width:0;height:0;transform-origin:0 0;z-index:3}
.badge .strap{position:absolute;left:-9px;top:0;width:18px;height:var(--ls,200px);border-radius:2px;
  background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(255,255,255,.08) 6px 7px),linear-gradient(90deg,#c9410f,var(--signal) 30%,#ff7a45 50%,var(--signal) 70%,#c9410f);
  box-shadow:6px 10px 14px -6px rgba(40,30,20,.35)}
.badge .clip{position:absolute;left:-11px;top:calc(var(--ls,200px) - 6px);width:22px;height:30px;border-radius:5px 5px 9px 9px;
  background:linear-gradient(90deg,#8d9096,#e9eaec 45%,#9a9da3);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25),0 3px 5px rgba(0,0,0,.25)}
.card-id{position:absolute;left:calc(var(--cw,200px) / -2);top:calc(var(--ls,200px) + 16px);width:var(--cw,200px);padding:26px 14px 14px;border-radius:12px;
  background:linear-gradient(180deg,#fdfcf9,#efece4);transform-origin:50% 0;cursor:grab;touch-action:none;user-select:none;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 0 0 1px rgba(0,0,0,.06),0 18px 30px -12px rgba(40,30,20,.45),0 4px 8px -4px rgba(40,30,20,.3)}
.card-id:active{cursor:grabbing}
.card-id::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;border-radius:12px 12px 0 0;background:var(--signal)}
.card-id .slot{position:absolute;left:50%;top:14px;width:34px;height:6px;margin-left:-17px;border-radius:3px;background:#d8d3c8;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.card-id img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:6px;margin-top:6px;pointer-events:none}
.card-id b{display:block;margin-top:12px;font:800 20px/1 var(--display);letter-spacing:-.02em;color:var(--ink)}
.card-id span{display:block;margin-top:6px;font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--signal)}
.card-id small{display:block;margin-top:10px;padding-top:9px;border-top:1px dashed #cfc9bc;font:500 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#8a877e}
.fphoto{float:right;width:84px;height:84px;border-radius:50%;object-fit:cover;margin:0 0 8px 12px;box-shadow:0 0 0 3px #fbfaf6,0 6px 14px -6px rgba(0,0,0,.35)}
.print{margin:0;padding:10px 10px 0;background:#fbfaf6;transform-origin:50% 50%;
  box-shadow:0 0 0 1px rgba(0,0,0,.05),6px 12px 18px -6px rgba(0,0,0,.45)}
.print img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;filter:saturate(.9) contrast(1.02)}
.print figcaption{font:500 10px/1.35 var(--mono);letter-spacing:.06em;color:#5f5d57;padding:9px 2px 11px}
.print figcaption .desc,.flatlist .awards .desc{display:block;margin-top:6px;letter-spacing:.02em;text-transform:none}
.print figcaption .demo,.flatlist .awards .demo{display:inline-block;margin-top:6px;color:var(--signal);text-decoration:none;font-weight:700}
.print figcaption strong{display:block;font:700 13px/1.2 var(--display);letter-spacing:-.01em;color:var(--ink);margin-bottom:2px}
.info .awards{margin-top:26px;padding-top:16px;border-top:1px solid rgba(233,230,223,.18)}
.info .awards .label,.flatlist .awards .label{display:block;margin-bottom:10px}
.info .awards li{font-size:14px}
.flatlist .awards{margin-top:22px}
.flatlist .awards .imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.flatlist .awards img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.flatlist .awards li{font-size:14px;color:#cfcbc2}
.hole{position:fixed;inset:0;z-index:24;pointer-events:none;opacity:0;background:#0b0b0d;
  clip-path:circle(var(--r, 0px) at var(--cx, 50%) var(--cy, 50%))}
.page{position:fixed;inset:0;z-index:25;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;gap:clamp(24px,5vw,80px);
  padding:80px clamp(16px,6vw,96px) 72px;background:#0b0b0d;color:#ecE9e2;opacity:var(--k,0);pointer-events:none;
  transform:scale(calc(1.06 - .06 * var(--k,0)))}
.page.open{pointer-events:auto}
html.flat .page,html.flat .hole{display:none}
.page .label{color:var(--signal)}
.page h2.kicker{text-transform:uppercase;font:800 clamp(36px,4.3vw,84px)/.9 var(--display);letter-spacing:-.04em;margin:.28em 0 .32em;white-space:nowrap}
.page .final{font-size:clamp(17px,1.35vw,21px);color:#bdb9b0;margin:0 0 22px}
.page .mail{display:inline-block;color:#fff;font:700 clamp(26px,2.6vw,44px)/1.1 var(--display);letter-spacing:-.02em;text-decoration:none;border-bottom:3px solid var(--signal)}
.page .ctas{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.page .btn.ghost{color:#ecE9e2}
.pg-prints{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px);margin-top:16px}
.page .print{position:relative;transform:rotate(var(--r))}
.page .print:nth-child(2){margin-top:40px}
.socket{position:absolute;width:40px;margin-left:-20px;border-radius:8px 8px 6px 6px;transform:translateZ(3px);
  background:linear-gradient(90deg,#1b1c20,#3a3b41 45%,#202125);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 6px 10px -2px rgba(0,0,0,.35)}
.socket::before{content:"";position:absolute;left:8px;right:8px;top:-3px;height:6px;border-radius:3px;background:#0a0a0b;box-shadow:inset 0 1px 2px #000}
.socket b{position:absolute;left:50%;bottom:9px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#3b2a24;transition:background .15s,box-shadow .15s}
.socket.seated b{background:var(--signal);box-shadow:0 0 8px 2px var(--signal-glow)}
.socket.seated{animation:thunk .32s cubic-bezier(.2,.8,.3,1)}
@keyframes thunk{0%{transform:translateZ(3px) scale(1,1)}30%{transform:translateZ(3px) scale(1.06,.93)}100%{transform:translateZ(3px) scale(1,1)}}
.hint{position:absolute;color:var(--mute);transition:opacity .4s}
/* WebGL 랙이 뜨면 CSS 랙은 자리만 남긴다(위치·크기를 읽는 원천) */
canvas.gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
html.gl .rack,html.gl .rack-shadow{visibility:hidden}

/* 랙: 책상 위에 누운 유로랙 케이스 */
.rack{position:absolute;transform-style:preserve-3d;transform:translateZ(26px);border-radius:10px;padding:14px 12px;display:flex;gap:4px;
  background:linear-gradient(180deg,#2b2c31,#1c1d21);box-shadow:0 0 0 1px #0c0c0e}
.rack-edge{position:absolute;left:0;right:0;top:100%;height:26px;transform-origin:50% 0;transform:rotateX(-90deg);background:linear-gradient(#26272b,#111214);border-radius:0 0 8px 8px}
.rack-side{position:absolute;top:0;bottom:0;width:26px;transform-origin:0 50%;transform:rotateY(90deg);background:linear-gradient(90deg,#1e1f23,#0e0f11)}
.rack-shadow{position:absolute;border-radius:24px;background:rgba(30,20,10,.42);filter:blur(28px)}
/* 3D 상자: 윗면(z = --d)과 앞·옆면. 랙 안 좌표에서 y+가 보는 사람 쪽, z+가 위 */
.box{position:absolute;transform-style:preserve-3d}
.box > i{position:absolute}
.box .t{inset:0;transform:translateZ(var(--d))}
.box .f{left:0;right:0;top:100%;height:var(--d);transform-origin:50% 0;transform:translateZ(var(--d)) rotateX(-90deg)}
.box .l,.box .r{top:0;bottom:0;width:var(--d);transform-origin:0 50%;transform:translateZ(var(--d)) rotateY(90deg)}
.box .l{left:0} .box .r{left:100%}
.rail .t{background:repeating-linear-gradient(90deg,#8d8d88 0 2px,#c4c4be 2px 22px);border-radius:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.rail .f{background:#6f6f6a}
.cheek .t{border-radius:3px;background:linear-gradient(90deg,#3c3d43,#2a2b30 60%,#232428);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 1px 0 0 rgba(255,255,255,.08)}
.cheek .f{background:linear-gradient(#1c1d21,#101113)}
.cheek .l,.cheek .r{background:linear-gradient(90deg,#17181b,#26272b)}
/* 모듈 판: 레일 위에 2px 떠 있는 두께 있는 알루미늄 판. 판 색과 어둠은 ::before가 맡아서 부품이 평면으로 눌리지 않는다 */
.mod{position:relative;height:100%;border-radius:4px;padding:18px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;flex:none;
  transform-style:preserve-3d;transform:translateZ(2px);--dim:calc(var(--dk) * 45%)}
.mod div{transform-style:preserve-3d}
.mod::before{content:"";position:absolute;inset:0;border-radius:4px;
  background:
   radial-gradient(160px 120px at var(--gx,50%) var(--gy,-20%),rgba(255,255,255,.55),transparent 70%),
   repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,.03) 1px 3px),
   linear-gradient(180deg,var(--alu-1),var(--alu-2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(0,0,0,.18),inset 1px 0 0 rgba(255,255,255,.5),inset -1px 0 0 rgba(0,0,0,.12);
  filter:brightness(calc(1 - var(--dk)*.45))}
.mod::after{content:"";position:absolute;left:1px;right:1px;top:100%;height:2px;transform-origin:50% 0;transform:rotateX(-90deg);background:#8b8b86;filter:brightness(calc(1 - var(--dk)*.45))}
.mod.on{--dim:calc(var(--dk) * 16%)}
.mod.on::before,.mod.on::after{filter:brightness(calc(1 - var(--dk)*.16))}
.mod.dark{color:#e9e6df}
.mod.dark::before{background:linear-gradient(180deg,#34353b,#202126);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.mod.dark::after{background:#141518}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fafaf8,#8e8e89 70%);box-shadow:0 1px 1px rgba(0,0,0,.4)}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:#6b6b66;transform:rotate(var(--r,30deg))}
.mod .name{font:800 15px/1 var(--display);letter-spacing:-.01em;text-transform:uppercase;text-align:center}
.logo{display:block;height:var(--lh,26px);aspect-ratio:var(--ar);background:currentColor;-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat}
.logos{display:flex;align-items:center;gap:14px}
.mod .name.logos{justify-content:center;--lh:17px;color:#26272b;min-height:22px}
.mod .name.logos .logo[style*=krafton]{--lh:34px}
.mod .name.logos:has(.logo+.logo){flex-direction:column;gap:8px;--lh:16px;color:#16171a}
.mod .name.logos .logo[style*=snu]{--lh:30px}
.info .card .logos{--lh:30px;margin:14px 0 2px;opacity:.92}
.info .card .logos .logo[style*=krafton]{--lh:52px}
.flatlist .fmod .logos{--lh:24px;margin:12px 0 0}
.info .card .logos .logo[style*=snu]{--lh:44px}
.flatlist .fmod .logos .logo[style*=snu]{--lh:36px}
.flatlist .fmod .logos .logo[style*=krafton]{--lh:44px}
.mod .sub{font:500 8.5px/1.2 var(--mono);letter-spacing:.16em;color:#55554f;text-transform:uppercase;text-align:center;margin-top:-8px}
.mod.dark .sub{color:#a7a49c}

<script>
// 언어: ?lang= > 저장한 선택 > 영어. 장면은 처음 한 번만 그리므로 전환은 새로 불러온다
(() => {
  let lang = new URLSearchParams(location.search).get('lang');
  if (lang !== 'ko' && lang !== 'en') { try { lang = localStorage.getItem('lang'); } catch {} }
  if (lang !== 'ko') lang = 'en';
  document.documentElement.lang = lang;
  if (lang === 'ko') { Object.assign(window.CONTENT, window.CONTENT_KO); document.title = window.CONTENT['meta.title']; }
  document.querySelectorAll('.lang a').forEach(a => {
    if (a.dataset.lang === lang) a.setAttribute('aria-current', 'true');
    a.addEventListener('click', e => {
      e.preventDefault(); if (a.dataset.lang === lang) return;
      try { localStorage.setItem('lang', a.dataset.lang); sessionStorage.setItem('langY', scrollY); } catch {}
      const u = new URL(location.href); u.searchParams.set('lang', a.dataset.lang); location.replace(u);
    });
  });
})();
</script>

<script>
(() => {
  // ── 장면 데이터: 연출의 단일 원천 ──
  // vh: 스크롤 길이(화면 높이 × vh/100). hp: 모듈 폭(1HP = 15px)
  // in: 벽 → 책상. 0~.12 정지, .14~.30 플러그가 벽 밑 모서리로 끌려 내려감, .18~.70 카메라가 숙임(바라보는 점은 .18~.54에 먼저 도착)
  // 모듈 장면: 0~.45 카메라가 옆으로, .2~.5 신호가 케이블을 지남, .5에 모듈이 켜짐, .5~.7 시각화, 그 뒤는 숨
  const SCENES = [
    { id: 'in',      vh: 300 },
    { id: 'krafton', vh: 100, hp: 10, logos: ['krafton'], name: 'KRAFTON', sub: 'FDE', parts: ['toggle'] },
    { id: 'ax',      vh: 100, hp: 10, name: 'AX ×2', sub: 'Advisory', parts: ['knobs2'] },
    { id: 'hdc',     vh: 150, hp: 18, logos: ['hdc'], name: 'HDC LABS', sub: 'AI Lab', parts: ['vu1', 'vu2', 'rooms', 'pads'] },
    { id: 'intern',  vh: 110, hp: 12, logos: ['naver', 'sony'], name: 'NAVER · Sony', sub: 'Music AI', parts: ['genres', 'knobs2'] },
    { id: 'snu',     vh: 130, hp: 16, logos: ['snu'], name: 'SNU', sub: 'DOSE · ICASSP', parts: ['scope', 'mixknob'] },
    { id: 'camp',    vh: 90,  hp: 8,  logos: ['naver'], name: 'Boostcamp', sub: 'Boostcamp AI Tech', parts: ['knobs2'] },
    { id: 'out',     vh: 110, hp: 12, name: 'Out', sub: 'Email', parts: ['bigjack'], dark: true, pass: true }, // 글 없이 지나간다. 카메라가 OUT 잭 위로 내려간다
    { id: 'contact', vh: 200, page: true }, // OUT 잭 구멍으로 들어가면 새 페이지가 열린다
  ];
  const T = { plug: [.14, .30], tilt: [.18, .70], look: [.18, .54], cam: [0, .45], sig: [.2, .5], on: .5, viz: [.5, .7], stop: .82 };
  const CABLE_LIFT = 32;
  // 벽 소켓: 아래 끝이 책상 케이블 시작점(이음새)을 덮고, 플러그는 위에서 SEAT만큼 박힌다. 플러그 몸통 60px, 금속 팁 18px
  const SOCKET = { h: 46, below: 8, seat: 24, hover: 22 };
  const OUT = SCENES.findIndex(s => s.id === 'out'), PAGE = SCENES.findIndex(s => s.page);
  // 잭 다이브: OUT 장면에서 카메라가 마지막 모듈에서 OUT 잭 위로 내려가며 다가가고(dive),
  // 다음 장면에서 구멍의 검은 원이 화면을 덮은 뒤(hole) 페이지가 열린다(page)
  const DIVE = { dive: [0, .95], hole: [0, .24], page: [.2, .44] };
  const CAM = { workTheta: 63, workD: .8 };

  const C = window.CONTENT || {};
  const md = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const cta = id => { const m = (C[id] || '').split('→').map(s => s.trim()); return { label: m[0], url: m[1] || '#' }; };
  // 본문의 ' ; '는 글머리표 구분자다. 한 줄이어도 글머리표로 둔다
  const bodyHTML = b => `<ul>${(b || '').split(' ; ').map(x => `<li>${md(x).replace(/(\S+ → \S+)/g, '<span class="nb">$1</span>')}</li>`).join('')}</ul>`;
  const splitTitle = s => { const m = (s || '').match(/^\*\*(.+?)\*\*[,.:]?\s*([\s\S]*)$/); return m ? [m[1], m[2]] : ['', s]; };
  const doc = document.documentElement;
  const mqN = matchMedia('(max-width: 820px)'), mqR = matchMedia('(prefers-reduced-motion: reduce)');
  const flat = () => mqN.matches || mqR.matches;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;

  document.querySelectorAll('[data-c]').forEach(el => {
    let h = md(C[el.dataset.c]);
    if (el.hasAttribute('data-br')) h = h.split(' / ').join('<br>');
    el.innerHTML = h;
  });

  document.getElementById('stLogo').addEventListener('click', e => { e.preventDefault(); scrollTo({ top: 0, behavior: mqR.matches ? 'auto' : 'smooth' }); });
  // 입체 이름은 글자마다 눌린다
  const markEl = document.getElementById('mark');
  markEl.innerHTML = [...markEl.textContent].map(ch => ch === ' ' ? ' ' : `<span>${ch}</span>`).join('');
  const letters = [...markEl.querySelectorAll('span')].map(el => ({ el, p: 0, c: [0, 0] }));

  // ── 모듈 하드웨어 ──
  const rack = document.getElementById('rack');
  // 노브 몸통: 캡 밑으로 2px마다 원판을 쌓고, 바닥에 치마와 패널 칼라를 둔다
  const knobHTML = (cls = '', ks = 54) => `<div class="knob ${cls}" style="--ks:${ks}px">${[2, 4, 6, 8, 10].map(z => `<b style="--z:${z}"></b>`).join('')}<b class="skirt" style="--z:11"></b><b class="collar" style="--z:14"></b><i></i></div>`;
  const PART = {
    toggle: () => `<div class="toggle" role="switch" aria-checked="false"><i></i></div>`,
    scope: () => `<div class="screen" style="height:120px"><canvas></canvas></div>`,
    mixknob: () => `<div style="display:flex;gap:18px;align-items:center">${knobHTML('mix', 58)}<span class="jack-l">${C['knob.dose'] || ''}</span></div>`,
    genres: () => `<div class="screen genres">${['HIP-HOP', 'BALLAD', 'ROCK', 'R&amp;B', 'DANCE'].map(g => `<span>TRK <b>${g}</b></span>`).join('')}</div>`,
    knobs2: () => `<div style="display:flex;gap:14px">${knobHTML('', 40)}${knobHTML('', 40)}</div>`,
    vu1: () => `<div class="vu"><span class="t">TOOL SELECT</span><span class="v" data-from="60" data-to="95" data-unit="%">60%</span><span class="scale"></span><i></i></div>`,
    vu2: () => `<div class="vu"><span class="t">LLM CALLS</span><span class="v" data-from="4" data-to="1" data-unit="">4</span><span class="scale"></span><i></i></div>`,
    rooms: () => `<div class="rooms">${'<span class="led"></span>'.repeat(7)}</div>`,
    pads: () => `<div class="pads">${['PLAN', 'APPROVE', 'BUILD', 'VERIFY'].map(p => `<button type="button">${p}</button>`).join('')}</div>`,
    bigjack: () => `<div class="bigjack"><span class="jack"></span></div>`,
  };
  // 로고는 알파만 쓰는 마스크라 패널에선 인쇄 잉크, 카드에선 글자색으로 칠해진다

  function layoutPatches() {
    if (patchSvg) patchSvg.remove(); patches = [];
    patchSvg = document.createElementNS(SVGNS, 'svg'); patchSvg.setAttribute('class', 'rope'); patchSvg.style.transform = 'translateZ(6px)';
    rack.appendChild(patchSvg);
    for (let i = 0; i < mods.length - 1; i++) {
      const [ox, oy] = relPos(mods[i].el.querySelector('.jack.out'), rack), [ix, iy] = relPos(mods[i + 1].el.querySelector('.jack.in'), rack);
      const sag = 60 + (ix - ox) * .3;
      const d = `M${ox} ${oy}C${ox + 6} ${oy + sag} ${ix - 6} ${iy + sag} ${ix} ${iy}`;
      const g = ['cable-sh', 'cable', 'cable-hi', 'cable-sig'].map(c => { const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('class', c); p.setAttribute('d', d); patchSvg.appendChild(p); return p; });
      g[0].setAttribute('transform', 'translate(6 12)'); g[1].style.strokeWidth = 7; g[0].style.strokeWidth = 9;
      const L = g[3].getTotalLength(); g[3].style.strokeDasharray = L; patches.push({ g, L });
    }
  }

  // ── 손: 플러그 끌기, 노브 돌리기, 패널 반사 ──
  let camNow = { th: 0, x: 0, y: 0, z: 0, d: 1 }, curMod = -1;
  const toWall = e => [e.clientX - W / 2 + WALLW / 2 + camNow.x, e.clientY - H / 2 + WALLH + camNow.y];
  plugEl.addEventListener('pointerdown', e => { if (camNow.th > 3) return; plugEl.setPointerCapture(e.pointerId); drag = toWall(e); touched = true; kick(); });
  plugEl.addEventListener('pointermove', e => { if (drag) { drag = toWall(e); kick(); } });
  const release = () => { if (!drag) return; const down = drag[1] > edgePt[1] - H * .28; drag = null; kick(); if (down) scrollTo({ top: stopY(1), behavior: 'smooth' }); };
  plugEl.addEventListener('pointerup', release); plugEl.addEventListener('pointercancel', release);
  plugEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); scrollTo({ top: stopY(1), behavior: 'smooth' }); } });
  addEventListener('pointermove', e => {
    if (camNow.th < 3) { mouse = toWall(e); kick(); } else mouse = null;
    const m = mods[curMod]; if (m) { const r = m.el.getBoundingClientRect(); m.el.style.setProperty('--gx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%'); m.el.style.setProperty('--gy', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%'); }
  }, { passive: true });
  const knobs = [...document.querySelectorAll('.rack .knob')].map((k, i) => ({ el: k, v: .25 + ((i * 37) % 50) / 100, touched: false }));
  function paintKnob(k) { k.el.querySelector('i').style.transform = `rotate(${(-135 + k.v * 270).toFixed(1)}deg)`; }
  knobs.forEach(k => {
    let y0 = 0, v0 = 0;
    k.el.addEventListener('pointerdown', e => { k.el.setPointerCapture(e.pointerId); y0 = e.clientY; v0 = k.v; k.touched = true; });
    k.el.addEventListener('pointermove', e => { if (!k.el.hasPointerCapture(e.pointerId)) return; k.v = clamp(v0 + (y0 - e.clientY) / 160, 0, 1); paintKnob(k); if (k === doseKnob) drawScope(k.v); });
    paintKnob(k);
  });
  const doseKnob = knobs.find(k => k.el.classList.contains('mix'));
  // WebGL 랙(rack-gl.js)과 주고받는 창구
  window.RACK = {
    knobs, kick: () => kick(), relayout: () => layout(), camTh: () => camNow.th, flat,
    setKnob: (k, v) => { k.v = clamp(v, 0, 1); k.touched = true; paintKnob(k); if (k === doseKnob) drawScope(k.v); kick(); },
  };
  document.querySelectorAll('.toggle').forEach(t => t.addEventListener('click', () => { t.dataset.touched = 1; t.classList.toggle('up'); t.setAttribute('aria-checked', t.classList.contains('up')); }));
  document.querySelectorAll('.pads button').forEach(b => b.addEventListener('click', () => { b.dataset.touched = 1; b.classList.toggle('lit'); }));

  // DOSE 스코프: 믹스에서 드럼 한 타가 떨어져 나온다
  const cv = mods.find(m => m.s.id === 'snu').el.querySelector('canvas'), cx = cv.getContext('2d');
  const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
  function drawScope(k) {
    cv.dataset.ver = (+cv.dataset.ver || 0) + 1;
    const w = cv.width = cv.clientWidth * 2, h = cv.height = cv.clientHeight * 2, mid = h / 2;
    cx.clearRect(0, 0, w, h);
    cx.strokeStyle = 'rgba(120,200,170,.12)'; cx.lineWidth = 1;
    for (let x = 0; x < w; x += w / 10) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, h); cx.stroke(); }
    cx.beginPath(); cx.moveTo(0, mid); cx.lineTo(w, mid); cx.stroke();
    cx.lineWidth = 2.4; cx.shadowBlur = 14;
    cx.strokeStyle = k > .5 ? '#ff6a2e' : '#9cf0cf'; cx.shadowColor = cx.strokeStyle;
    cx.beginPath();
    for (let i = 0; i <= 400; i++) {
      const t = i / 400, x = t * w;
      const m = (Math.sin(t * 90) * .4 + Math.sin(t * 233 + 1) * .25 + (hash(i) - .5) * .7) * (.55 + .45 * Math.sin(t * 7));
      const hit = t > .3 ? Math.sin((t - .3) * 160) * Math.exp(-(t - .3) * 11) : 0;
      const y = mid - (m * (1 - k) + hit * 1.3 * k) * h * .34;
      i ? cx.lineTo(x, y) : cx.moveTo(x, y);
    }
    cx.stroke();
  }

  // 커서가 가까운 글자일수록 깊게 눌린다. 멀어지면 천천히 다시 솟는다
  function stepMark(dt) {
    if (!dt) return;
    markE = 0;
    const on = mouse && camNow.th < 3;
    letters.forEach(l => {
      const d = on ? Math.hypot(mouse[0] - l.c[0], (mouse[1] - l.c[1]) * 1.3) : 1e9;
      const t = 1 - sm(markR * .35, markR * 1.25, d);
      l.p += (t - l.p) * (1 - Math.exp(-dt * (t > l.p ? 22 : 7)));
      if (Math.abs(t - l.p) < .002) l.p = t;
      markE += Math.abs(t - l.p);
      l.el.style.setProperty('--p', l.p.toFixed(3));
    });
  }
  // ── 사원증: 줄은 강체 진자(bA), 카드는 클립에서 한 번 더 꺾이는 두 번째 진자(bP)라 늦게 따라온다 ──
  function stepBadge(dt) {
    if (!dt) return badgeE;
    const L = parseFloat(badge.style.getPropertyValue('--ls')) || 200, g = 1500;
    if (bDrag) {
      const na = clamp(-Math.atan2(bDrag[0] - badgeA[0], bDrag[1] - badgeA[1]), -1.1, 1.1);
      bW = lerp(bW, (na - bA) / dt, .5); bA = na;
    } else {
      bW += (-g / L * Math.sin(bA) - .55 * bW) * dt; bA += bW * dt;
    }
    bPW += (-(bP - bA) * 60 - 3.2 * bPW - bW * .8) * dt; bP += bPW * dt; // 줄이 꺾이면 카드가 반대로 한 번 처진다
    badge.style.transform = `rotate(${bA.toFixed(4)}rad)`;
    badgeCard.style.transform = `rotate(${(bP - bA).toFixed(4)}rad)`;
    return badgeE = Math.abs(bW) + Math.abs(bA) * .5 + Math.abs(bPW) + Math.abs(bP - bA);
  }
  badgeCard.addEventListener('pointerdown', e => { if (camNow.th > 3) return; badgeCard.setPointerCapture(e.pointerId); bDrag = toWall(e); kick(); });
  badgeCard.addEventListener('pointermove', e => {
    if (bDrag) { bDrag = toWall(e); kick(); return; }
    if (camNow.th < 3 && e.movementX) { bW -= e.movementX * .012; kick(); } // 스치면 밀린다
  });
  const bRelease = () => { if (!bDrag) return; bDrag = null; kick(); };
  badgeCard.addEventListener('pointerup', bRelease); badgeCard.addEventListener('pointercancel', bRelease);

  // ── 루프 하나. 할 일이 없으면 잠든다 ──
  let target = scrollY, shown = scrollY, last = 0, raf = 0, ropeE = 1, idle = 0, lastDir = 1, lastDose = -1;
  const kick = () => { if (!raf && ready && !flat()) { last = performance.now(); raf = requestAnimationFrame(frame); } };
  addEventListener('scroll', () => { lastDir = scrollY >= target ? 1 : -1; target = scrollY; clearTimeout(idle); idle = setTimeout(snap, 450); kick(); }, { passive: true });

  // 정거장 스냅: 손을 놓고 450ms 뒤, 가던 방향의 정거장이 가까우면 붙고 반대 방향으로는 끌지 않는다
  function snap() {
    if (flat()) return;
    const y = scrollY;
    const ahead = SCENES.map((s, i) => s.pass ? -1 : stopY(i)).filter(s => s >= 0).filter(s => lastDir > 0 ? s >= y : s <= y).sort((a, b) => Math.abs(a - y) - Math.abs(b - y))[0];
    if (ahead != null && Math.abs(ahead - y) < H * .35 && Math.abs(ahead - y) > 4) scrollTo({ top: ahead, behavior: 'smooth' });
  }

  function frame(now) {
    raf = 0;
    const dt = Math.min(48, now - last) / 1000; last = now; // 깨어난 첫 프레임의 쌓인 시간은 버린다
    if (flat()) return;
    shown += (target - shown) * (1 - Math.exp(-dt * 1000 / 45));
    if (Math.abs(target - shown) < .3) shown = target;
    render(shown, dt);
    if (shown !== target || ropeE > .02 || drag || introT < 4.2 || badgeE > .003 || bDrag || markE > .004 || (seatT >= 0 && seatT < .5)) raf = requestAnimationFrame(frame);
  }

  function render(y, dt) {
    let si = SCENES.length - 1;
    for (let i = 0; i < SCENES.length; i++) if (y < starts[i] + SCENES[i].vh / 100 * H) { si = i; break; }
    const u = clamp((y - starts[si]) / (SCENES[si].vh / 100 * H), 0, 1);

    // 카메라: 정거장 사이의 끝값은 다음 정거장 값과 같아서 경계에서 튀지 않는다
    let cam;
    if (si === 0) cam = mixCam(heroCam(), modCam(0), sm(T.tilt[0], T.tilt[1], u), sm(T.look[0], T.look[1], u));
    else if (si === 1) cam = modCam(0);
    else if (si === OUT) { const k = sm(DIVE.dive[0], DIVE.dive[1], u), e = k * k * (3 - 2 * k); cam = mixCam(modCam(si - 2), jackCam(), e, e); } // 잭이 화면 한가운데 오도록 위치와 각도를 같은 이징으로 맞춘다
    else if (si >= PAGE) cam = jackCam();
    else cam = mixCam(modCam(si - 2), modCam(si - 1), sm(T.cam[0], T.cam[1], u));
    camNow = cam; setCamera(cam);

    // 조명: 들어갈수록 방이 어두워지고 신호와 LED만 남는다
    const prog = y / total, dk = clamp(sm(.07, .45, prog) * .8 + sm(.82, 1, prog) * .2, 0, 1);
    doc.style.setProperty('--dk', dk.toFixed(3));
    doc.classList.toggle('night', dk > .45);
    doc.style.setProperty('--bg', `color-mix(in oklab, #d9d4c9, #141416 ${(dk * 90).toFixed(1)}%)`);
    doc.style.background = `color-mix(in oklab, #ece9e2, #141416 ${(dk * 90).toFixed(1)}%)`;
    scrim.classList.toggle('show', si > 0 && si < OUT);
    mark.style.opacity = si === 0 ? (1 - sm(.72, .96, u)).toFixed(3) : 0;

    // 벽 케이블과 신호
    const plugK = si > 0 ? 1 : sm(T.plug[0], T.plug[1], u);
    ropeE = stepRope(dt, plugK);
    stepBadge(dt); stepMark(dt);
    const L = ropeEls[3].getTotalLength(); ropeEls[3].style.strokeDasharray = L;
    ropeEls[3].style.strokeDashoffset = (L * (1 - (si > 0 ? 1 : sm(.3, .46, u)))).toFixed(1);
    const dcDraw = si > 0 ? 1 : sm(.24, .32, u);
    dc.slice(0, 3).forEach(e => e.style.strokeDashoffset = (dcLen * (1 - dcDraw)).toFixed(1));
    dc[3].style.strokeDashoffset = (dcLen * (1 - (si > 0 ? 1 : sm(.46, .7, u)))).toFixed(1);
    hint.style.opacity = si === 0 && u < .04 && introT > 1.4 ? 1 : 0;
    hero.style.opacity = si === 0 ? (1 - sm(.3, .46, u)).toFixed(3) : 0;

    // 모듈: 신호가 닿으면 켜진다
    const onIdx = si === 0 ? (u > .72 ? 0 : -1) : (si === 1 ? 0 : si - 1 - (u < T.on ? 1 : 0));
    curMod = Math.max(0, si - 1);
    mods.forEach((m, i) => {
      const on = i <= onIdx;
      m.el.classList.toggle('on', on);
      const lu = i === 0 ? (si === 0 ? sm(.72, 1, u) * .7 : 1) : si - 1 === i ? u : si - 1 > i ? 1 : 0;
      viz(m, lu, on);
    });
    patches.forEach((p, i) => { const f = si > i + 2 ? 1 : si === i + 2 ? sm(T.sig[0], T.sig[1], u) : 0; p.g[3].style.strokeDashoffset = (p.L * (1 - f)).toFixed(1); });
    const c = modC[curMod];
    if (c) { desk.style.setProperty('--spot-x', (WALLW / 2 + c[0]) + 'px'); desk.style.setProperty('--spot-y', (rackZ + rackH * .55) + 'px'); }
    if (window.rackGL) rackGL.frame({ W, H, P, cam, dk, spot: c ? [c[0], rackZ + rackH * .55] : [0, 0],
      patch: patches.map((_, i) => si > i + 2 ? 1 : si === i + 2 ? sm(T.sig[0], T.sig[1], u) : 0),
      deskDraw: dcDraw, deskSig: si > 0 ? 1 : sm(.46, .7, u) });

    // 글 카드
    cards.forEach((el, i) => {
      if (!el) return;
      const show = (i === si && (i === 1 || u > .3)) || (i === 1 && si === 0 && u > .8);
      el.classList.toggle('show', show); el.classList.toggle('pre', !show); el.classList.toggle('day', dk < .3);
    });
    stops.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.i === si));

    // 잭 구멍 → 새 페이지. 원의 반지름은 잭이 화면에서 보이는 크기에서 시작해 화면 대각선까지 커진다
    const pu = si === PAGE ? u : si > PAGE ? 1 : 0;
    const hk = sm(DIVE.hole[0], DIVE.hole[1], pu), pk = sm(DIVE.page[0], DIVE.page[1], pu);
    // 원은 잭 안쪽 검은 구멍이 지금 화면에 보이는 자리와 크기에서 시작한다(투영된 rect라 카메라와 어긋나지 않는다)
    if (hk > 0) {
      let js = window.rackGL && rackGL.jackScreen();
      if (!js) { const jr = outJackEl.getBoundingClientRect(); js = { x: jr.left + jr.width / 2, y: jr.top + jr.height / 2, r: jr.width * .212 }; }
      holeEl.style.setProperty('--cx', js.x.toFixed(1) + 'px');
      holeEl.style.setProperty('--cy', js.y.toFixed(1) + 'px');
      holeEl.style.setProperty('--r', lerp(js.r, Math.hypot(W, H), hk * hk).toFixed(1) + 'px');
    }
    holeEl.style.opacity = hk > 0 ? 1 : 0;
    pageEl.style.setProperty('--k', pk.toFixed(3));
    pageEl.classList.toggle('open', pk > .5);
    if (pk > .5) pageEl.removeAttribute('inert'); else pageEl.setAttribute('inert', '');
  }

  function viz(m, lu, on) {
    const el = m.el, k = sm(T.viz[0], T.viz[1], lu);
    switch (m.s.id) {
      case 'krafton': { const t = el.querySelector('.toggle'); if (!t.dataset.touched) t.classList.toggle('up', on); break; }
      case 'snu': { if (!doseKnob.touched) { doseKnob.v = k; paintKnob(doseKnob); } if (Math.abs(doseKnob.v - lastDose) > .002) { drawScope(doseKnob.v); lastDose = doseKnob.v; } break; }
      case 'hdc': {
        el.querySelectorAll('.vu').forEach(v => {
          const n = v.querySelector('.v'), a = +n.dataset.from, b = +n.dataset.to, val = a + (b - a) * k;
          n.textContent = Math.round(val) + n.dataset.unit;
          const norm = n.dataset.unit ? (val - 40) / 60 : (val - 1) / 4;
          const deg = (-50 + clamp(norm, 0, 1) * 100).toFixed(1); v.dataset.a = deg;
          v.querySelector('i').style.transform = `rotate(${deg}deg)`;
        });
        const hot = k > .6 ? [3] : on ? [0, 2, 3, 5] : [];
        el.querySelectorAll('.rooms .led').forEach((r, j) => r.classList.toggle('lit', hot.includes(j)));
        el.querySelectorAll('.pads button').forEach((b, j) => { if (!b.dataset.touched) b.classList.toggle('lit', k > j / 4 + .02); });
        break;
      }
    }
  }

  addEventListener('resize', layout);
  mqN.addEventListener('change', layout); mqR.addEventListener('change', layout);
  layout();
  // 언어를 바꾸고 다시 불러왔으면 보던 자리로 돌아간다
  try { const y = sessionStorage.getItem('langY'); if (y != null) { sessionStorage.removeItem('langY'); scrollTo(0, +y); } } catch {}
  if (document.fonts) document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
